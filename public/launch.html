<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04050b"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Neuroflux"><title>Neuroflux</title><script>window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.nfxInstallPrompt=e;window.dispatchEvent(new Event("nfx-install-ready"));});</script></head><body style="margin:0;background:#04050b;color:#b4d4e4;font:14px system-ui;display:grid;place-items:center;height:100svh"><main><p id="bootStatus">Loading Neuroflux…</p><a href="/update.html" style="color:#45f0ff">App update help</a></main><script>
(async()=>{try{
 const response=await fetch('/release.json',{cache:'no-store'});if(!response.ok)throw Error('Release unavailable');
 const release=await response.json();if(!/^[a-f0-9]{16}$/.test(release.version)||release.app!=='/releases/'+release.version+'/app.html')throw Error('Invalid app release');
 const app=await fetch(release.app);if(!app.ok)throw Error('App files unavailable');
 const html=await app.text();document.open();document.write(html);document.close();
}catch(error){document.getElementById('bootStatus').textContent='Could not load the app: '+error.message+'. Check your connection and try again.';}})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3d7c1"><title>Fuzzy Camera</title><link rel="stylesheet" href="/showcase/style.css"></head><body><main id="app" data-state="idle"><div class="background"></div><div class="intro"><span>THE LITTLE MOMENTS</span><h1>Make something<br><em>beautiful.</em></h1><p>Touch the fluff to begin</p></div><div id="scene" aria-hidden="true"></div><button id="orb" aria-label="Open camera choices"></button><div id="choices" aria-label="Choose an option"><button data-choice="camera"><img src="/showcase/camera.svg" alt=""><span>CAMERA</span></button><button data-choice="video"><img src="/showcase/video.svg" alt=""><span>VIDEO</span></button><button data-choice="gallery"><img src="/showcase/images.svg" alt=""><span>GALLERY</span></button></div><section id="cameraFrame" aria-label="Camera" hidden><video id="preview" autoplay playsinline muted></video><canvas id="fur" aria-hidden="true"></canvas><button id="close" aria-label="Close camera"><img src="/showcase/x.svg" alt=""></button><button id="flip" aria-label="Switch camera"><img src="/showcase/switch-camera.svg" alt=""></button><button id="shutter" aria-label="Take photo"><i></i></button><button id="gallery" aria-label="Open photo library"><img src="/showcase/images.svg" alt=""></button><label id="zoomWrap" hidden>ZOOM <input type="range" id="zoom" aria-label="Camera zoom"></label><label id="exposureWrap" hidden>EXPOSURE <input type="range" id="exposure" aria-label="Camera exposure"></label><span id="videoLabel" hidden>VIDEO · silent</span></section><input id="files" type="file" accept="image/*,video/*" hidden><section id="result" hidden><img id="photo" alt="Captured photo"><video id="playback" controls playsinline hidden></video><div><button id="retake">BACK</button><button id="save">SAVE / SHARE</button></div></section><p id="status" role="status" aria-live="polite"></p><div class="footer">A LITTLE MOMENT OF MAGIC</div></main><script src="/showcase/app.js" defer></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04050b"><title>Neuroflux Visual Rig</title></head><body style="margin:0;background:#04050b;color:#7088ad;font:11px monospace;letter-spacing:.3em;display:grid;place-items:center;height:100vh">BOOTING NEUROFLUX&hellip;<script>(async()=>{try{const b=await Promise.all([0,1,2,3,4].map(i=>fetch('/c'+i+'.bin',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()})));let n=0;b.forEach(x=>n+=x.byteLength);const u=new Uint8Array(n);let o=0;b.forEach(x=>{u.set(new Uint8Array(x),o);o+=x.byteLength});const t=u[0]===31&&u[1]===139?await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(u);document.open();document.write(t);document.close()}catch(e){document.body.textContent='Could not start ('+e.message+'). Update your browser and reload.'}})()</script></body></html>

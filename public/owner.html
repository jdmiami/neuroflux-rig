<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04050b"><title>Neuroflux owner access</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#04050b;color:#dcecff;font:16px/1.6 system-ui}main{width:min(420px,85vw);padding:24px;border:1px solid #284857;border-radius:16px}a{display:block;color:#45f0ff;margin:18px 0}</style></head><body><main><h1>Owner access</h1><p>The private assistant is available only to Neuroflux’s GitHub owner.</p><p id="status" role="status">Checking access…</p><a id="signin" href="/api/auth/signin?callbackUrl=%2Flaunch.html" hidden>SIGN IN WITH GITHUB</a><a href="/launch.html">OPEN NEUROFLUX</a><a href="https://github.com/jdmiami/neuroflux-rig/blob/main/docs/Owner-Assistant-Setup.md" target="_blank" rel="noopener">OWNER SETUP GUIDE</a></main><script>fetch('/api/owner',{cache:'no-store'}).then(r=>r.json()).then(s=>{document.querySelector('#status').textContent=s.owner?'Signed in. Open Neuroflux to use the private chat.':s.configured?'Sign in with the repository owner account.':'Owner sign-in needs to be configured in Vercel first.';document.querySelector('#signin').hidden=s.owner||!s.configured;}).catch(()=>document.querySelector('#status').textContent='Could not check access. Try again.');</script></body></html>

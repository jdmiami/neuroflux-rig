4));}\nfloat depthAt(vec2 uv){return texture(uDepth,camUV(uv)).r;}\nfloat camEdge(vec2 uv,vec2 px){\n  float tl=camL(uv+px*vec2(-1,1)),t=camL(uv+px*vec2(0,1)),tr=camL(uv+px*vec2(1,1)),l=camL(uv-px*vec2(1,0)),\n  r=camL(uv+px*vec2(1,0)),bl=camL(uv-px),b=camL(uv-px*vec2(0,1)),br=camL(uv+px*vec2(1,-1));\n  float gx=-tl-2.*l-bl+tr+2.*r+br,gy=tl+2.*t+tr-bl-2.*b-br;return length(vec2(gx,gy));}\nvec3 camBlend(vec3 vis,vec2 uv,vec2 px,float pulse,vec3 edgeCol){\n  vec3 cam=camRGB(uv);int m=int(uCamBlend+.5);vec3 b;\n  float cl=dot(cam,vec3(.299,.587,.114));\n  if(m==0)b=1.-(1.-vis)*(1.-cam);\n  else if(m==1)b=vis+cam;\n  else if(m==2)b=abs(vis-cam);\n  else if(m==3)b=vis*cam*2.2;\n  else if(m==4)b=mix(vis,cam,smoothstep(uCamKey-.08,uCamKey+.08,cl));\n  else{float d=uDepthOn>.5?depthAt(uv):cl;float k=uCamKey-pulse*.12;b=mix(vis,cam,smoothstep(k-.06,k+.06,d));}\n  // First half brings in the selected blend; the final pass fades to raw camera.\n  float amount=clamp(uCamMix*2.,0.,1.);\n  vec3 o=mix(vis,b,amount);\n  if(uCamEdge>.001)o+=edgeCol*smoothstep(.12,.7,camEdge(uv,px*1.5))*uCamEdge*1.6*amount;\n  return o;}\n",n="\nuniform vec4 uTouch[6];uniform float uTouchMode,uTouchAmt;\n",a=e+t+n+"\nuniform vec2 uRes;uniform vec2 uCenter;uniform float uCamWarp;\nuniform float uTime,uBass,uMid,uHigh,uLevel,uBeat,uMode,uCx,uScale,uSym,uWarp,uDensity,uMorph,uTwist,uRot,uTravel,uWobble,uHue,uPal,uRing;\nuniform sampler2D uSpec;\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);\n  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}\nfloat fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=rot(.5)*p*2.03+3.1;a*=.5;}return v;}\nfloat spec(float x){return texture(uSpec,vec2(clamp(x,0.,1.),.5)).r;}\nvec3 pal(float t){\n  vec3 a=vec3(.5),b=vec3(.5),c=vec3(1.),d=vec3(0.,.33,.67);\n  int p=int(uPal+.5);\n  if(p==1){c=vec3(1.,1.,.5);d=vec3(.8,.9,.3);}\n  else if(p==2){c=vec3(1.,.7,.4);d=vec3(0.,.15,.2);}\n  else if(p==3){
